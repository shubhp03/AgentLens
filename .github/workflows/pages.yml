# Publishes the dashboard in DEMO mode (synthetic data, no backend) to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions". URL: https://<user>.github.io/<repo>/
name: pages
on:
  push: {branches: [main], paths: ["dashboard/**", "scripts/build_pages.sh", ".github/workflows/pages.yml"]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: dashboard/package-lock.json}
      - run: BASE_HREF="/${{ github.event.repository.name }}/" bash scripts/build_pages.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: dashboard/dist/dashboard/browser}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
