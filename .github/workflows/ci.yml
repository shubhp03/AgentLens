name: ci
on:
  pull_request:
  push: {branches: [main]}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/validate_contracts.py
      - run: uv run pytest -q   # includes gateway tests on embedded PostgreSQL 16 (pgserver)
      - run: uv run python scripts/stack_smoke.py

  dashboard:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('dashboard/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: dashboard/package-lock.json}
      - run: cd dashboard && npm ci && npm run test:ci && npm run build:demo
