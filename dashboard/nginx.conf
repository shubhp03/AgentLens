server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # config.json and index.html must never be cached: they change per deployment/build.
  location = /config.json { add_header Cache-Control "no-store"; }
  location = /index.html  { add_header Cache-Control "no-cache"; }

  # Hashed bundles can be cached forever.
  location ~* \.(js|css)$ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # Single-page app: unknown paths fall back to index.html (deep links like /runs/<id>).
  location / { try_files $uri $uri/ /index.html; }

  gzip on;
  gzip_types application/json application/javascript text/css;
}
