[project]
name = "agentlens-evals"
version = "0.1.0"
description = "Eval harness: dataset schema, scorers, statistics, regression gate, CLI."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "httpx>=0.27", "agentlens-agent"]

[project.scripts]
agentlens-eval = "agentlens_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlens_evals"]

[tool.uv.sources]
agentlens-agent = { workspace = true }
