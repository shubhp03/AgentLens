[project]
name = "agentlens-agent"
version = "0.1.0"
description = "Agent runtime: tool-calling loop, tracing events, provider adapters."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=2,<3",
  "anthropic>=0.40",
  "pyyaml>=6",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlens_agent"]
