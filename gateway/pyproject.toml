[project]
name = "agentlens-gateway"
version = "0.1.0"
description = "Control plane: auth, rate limits, cost cap, run orchestration, trace storage, SSE, eval API."
requires-python = ">=3.11"
dependencies = [
  "agentlens-agent",   # event models (the wire protocol) - single source of truth
  "agentlens-evals",   # Wilson / McNemar / comparison / failure categories - no second implementation
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[tool.uv.sources]
agentlens-agent = {workspace = true}
agentlens-evals = {workspace = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlens_gateway"]
