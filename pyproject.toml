# Virtual uv workspace root. Python services live in agent/, tools/, evals/.
[tool.uv.workspace]
members = ["agent", "tools", "evals", "gateway"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "jsonschema>=4",
  "openapi-spec-validator>=0.7",
  "pyyaml>=6",
  # Docker-free real Postgres for the gateway tests and scripts/smoke_schema.py (wheels exist for Python 3.11/3.12 only,
  # hence .python-version = 3.12)
  "pgserver>=0.1",
  "psycopg2-binary>=2.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["agent/tests", "tools/tests", "evals/tests", "gateway/tests"]
